name: Bug Report
description: Report an issue or unexpected behavior in Agent Interaction Kit
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue!
        
        > [!IMPORTANT]
        > If you have found a potential security vulnerability, please do **not** file a public issue.
        > Submit it privately via [GitHub Security Advisories](https://github.com/DevJoaoLopes/agent-interaction-kit/security/advisories/new).
  - type: input
    id: aik-version
    attributes:
      label: AIK Version
      description: What version of `@agent-interaction-kit/core` are you running? (e.g. `0.1.0` or output from `aik --version`)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node-and-os
    attributes:
      label: Node & OS
      description: What Node.js version and Operating System are you using?
      placeholder: "Node v24.2.0, macOS Sonoma 14.5"
    validations:
      required: true
  - type: textarea
    id: reproduction-command
    attributes:
      label: Minimal Reproduction Command
      description: What exact command was executed to reproduce this behavior?
      placeholder: "pnpm exec aik check --provider ./provider.json --consumer ./consumer.json --strict"
      render: shell
    validations:
      required: true
  - type: textarea
    id: sanitized-manifests
    attributes:
      label: Sanitized Manifests
      description: Minimal `aik.provider.json` and `aik.consumer.json` manifests reproducing the issue. Please remove all proprietary, confidential, or sensitive application data.
      placeholder: |
        // aik.provider.json
        {
          "manifestVersion": "1.0",
          "buildId": "git-101",
          "tools": []
        }

        // aik.consumer.json
        {
          "manifestVersion": "1.0",
          "buildId": "git-201",
          "expectations": []
        }
      render: json
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The check should pass with exit code 0 because..."
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened? Include terminal output, exit codes, and diagnostic messages.
      placeholder: "Exited with code 1 and error diagnostic..."
      render: shell
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, stack traces, or relevant details here.
