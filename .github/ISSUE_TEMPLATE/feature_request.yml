name: Feature Request
description: Suggest an idea or enhancement for Agent Interaction Kit
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement for Agent Interaction Kit!
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen, or how you would like AIK to support this workflow.
      placeholder: "Add support for..."
    validations:
      required: true
  - type: textarea
    id: usage-example
    attributes:
      label: Usage Example
      description: Provide an example of how this would be used (e.g. CLI invocation, TypeScript API snippet, or manifest format).
      placeholder: |
        // CLI usage or API example:
        aik check --provider ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, references, or screenshots about the feature request here.
