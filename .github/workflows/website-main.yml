name: Website Main Promotion

on:
  workflow_run:
    workflows: ["CI Matrix"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  classify:
    name: Classify and Evaluate Promotion
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.repository == 'DevJoaoLopes/agent-interaction-kit'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.eval.outputs.should_deploy }}
      site_sha: ${{ steps.eval.outputs.site_sha }}
      release_tag: ${{ steps.eval.outputs.release_tag }}
      package_version: ${{ steps.eval.outputs.package_version }}
      reason: ${{ steps.eval.outputs.reason }}
    steps:
      - name: Checkout HEAD commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Classify changes and evaluate deploy promotion
        id: eval
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          echo "Analyzing commit: $HEAD_SHA in repo $REPO"

          # 1. Extract changed files in candidate commit (handling merge commits cleanly)
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r -m "$HEAD_SHA" | sort -u)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files detected in $HEAD_SHA. Skipping deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$CHANGED_FILES"
          export CHANGED_FILES

          FILES_CSV=$(echo "$CHANGED_FILES" | paste -sd, -)

          # 2. Classify change scope
          CLASSIFY_OUTPUT=$(node scripts/deploy/policy.mjs classify --files "$FILES_CSV")
          echo "Classification result: $CLASSIFY_OUTPUT"
          IS_WEBSITE_ONLY=$(echo "$CLASSIFY_OUTPUT" | jq -r '.websiteOnly')

          if [ "$IS_WEBSITE_ONLY" != "true" ]; then
            REASON=$(echo "$CLASSIFY_OUTPUT" | jq -r '.reason')
            echo "Commit is not website-only ($REASON). Skipping deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Query verified publication asset via GitHub CLI
          echo "Fetching latest publication asset via GitHub CLI..."
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          RELEASES_JSON=$(gh release list --repo "$REPO" --limit 10 --json tagName 2>/dev/null || echo "[]")
          TAGS=$(echo "$RELEASES_JSON" | jq -r '.[].tagName // empty')

          if [ -z "$TAGS" ]; then
            echo "No releases found in $REPO. Cannot promote website without verified release."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUBLICATIONS="[]"
          for TAG in $TAGS; do
            if gh release download "$TAG" --repo "$REPO" -p "publication.json" -D "$TMP_DIR" 2>/dev/null; then
              PUB_FILE="$TMP_DIR/publication.json"
              if [ -f "$PUB_FILE" ]; then
                PUB_CONTENT=$(cat "$PUB_FILE")
                PUBLICATIONS=$(node -e '
                  const pubs = JSON.parse(process.argv[1]);
                  const newPub = JSON.parse(process.argv[2]);
                  pubs.push(newPub);
                  console.log(JSON.stringify(pubs));
                ' "$PUBLICATIONS" "$PUB_CONTENT")
                rm -f "$PUB_FILE"
              fi
            fi
          done

          echo "Found $(echo "$PUBLICATIONS" | jq 'length') candidate publication assets."
          export PUBLICATIONS

          # 4. Check current promoted site metadata
          CURRENT_SITE="null"
          if [ -n "$SITE_URL" ]; then
            CURRENT_SITE=$(curl -sSf "${SITE_URL%/}/version.json" 2>/dev/null || echo "null")
          fi
          export CURRENT_SITE

          # 5. Evaluate deploy promotion using policy.mjs evaluate
          EVAL_INPUT=$(node -e '
            const rawFiles = process.env.CHANGED_FILES || "";
            const files = rawFiles.split("\n").map((s) => s.trim()).filter(Boolean);
            let pubs = [];
            try { pubs = JSON.parse(process.env.PUBLICATIONS || "[]"); } catch {}
            let current = null;
            try { current = JSON.parse(process.env.CURRENT_SITE || "null"); } catch {}
            const input = {
              event: "push",
              conclusion: "success",
              branch: "main",
              isFork: false,
              changedFiles: files,
              currentSite: current,
              candidateSite: { sha: process.env.HEAD_SHA },
              publications: pubs,
            };
            console.log(JSON.stringify(input));
          ')

          EVAL_RESULT=$(node scripts/deploy/policy.mjs evaluate --input "$EVAL_INPUT")
          echo "Evaluation result: $EVAL_RESULT"

          STATUS=$(echo "$EVAL_RESULT" | jq -r '.status')
          if [ "$STATUS" = "promote_website" ]; then
            VERSION=$(echo "$EVAL_RESULT" | jq -r '.version')
            TAG=$(echo "$EVAL_RESULT" | jq -r '.publication.tag')
            echo "Promotion approved for website-only commit."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "site_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "reason=website" >> "$GITHUB_OUTPUT"
          else
            REASON=$(echo "$EVAL_RESULT" | jq -r '.reason // "Not eligible for promotion"')
            echo "Promotion not approved: $STATUS ($REASON)"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy Website
    needs: classify
    if: needs.classify.outputs.should_deploy == 'true'
    uses: ./.github/workflows/deploy-website.yml
    with:
      site-sha: ${{ needs.classify.outputs.site_sha }}
      release-tag: ${{ needs.classify.outputs.release_tag }}
      package-version: ${{ needs.classify.outputs.package_version }}
      reason: ${{ needs.classify.outputs.reason }}
    secrets: inherit
