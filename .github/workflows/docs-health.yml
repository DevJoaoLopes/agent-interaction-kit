name: Docs Health

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser dependencies
        run: pnpm --filter @agent-interaction-kit/website exec playwright install --with-deps chromium

      - name: Query live site metadata and verify documentation health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          TARGET_URL="${SITE_URL:-https://agent-interaction-kit.vercel.app}"
          TARGET_URL="${TARGET_URL%/}"
          echo "Querying live site metadata from $TARGET_URL/version.json..."
          VERSION_JSON=$(curl -fsSL "$TARGET_URL/version.json")
          VERSION=$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "$VERSION_JSON")
          SHA=$(node -e 'console.log(JSON.parse(process.argv[1]).siteSha)' "$VERSION_JSON")

          if [ -z "$VERSION" ] || [ "$VERSION" = "unreleased" ]; then
            echo "::error::Live site reports missing or unreleased version: '$VERSION'"
            exit 1
          fi

          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Live site reports invalid siteSha: '$SHA'"
            exit 1
          fi

          echo "Discovered live metadata: version=$VERSION, siteSha=$SHA"
          echo "Running documentation snippets and published package verification..."
          node scripts/docs/verify-published.mjs "$TARGET_URL" --expected-version "$VERSION" --expected-site-sha "$SHA"

          echo "Running Playwright browser tests against live site..."
          SITE_TEST_URL="$TARGET_URL" pnpm test:web
