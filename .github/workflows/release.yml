name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to resume
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: aik-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs['packages/core--release_created'] }}
      tag: ${{ steps.rp.outputs['packages/core--tag_name'] }}
      sha: ${{ steps.rp.outputs['packages/core--sha'] }}
    steps:
      - name: Verify CI completion and branch currency
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CANDIDATE_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          echo "Candidate commit: $CANDIDATE_SHA"

          # Check if main has already advanced past candidate SHA
          LATEST_MAIN=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ -n "$LATEST_MAIN" ] && [ "$LATEST_MAIN" != "$CANDIDATE_SHA" ]; then
            echo "main has already moved to $LATEST_MAIN (current run is for $CANDIDATE_SHA)."
            echo "Skipping release-please in this run to allow the newer run to reconcile."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Waiting for CI completion on $CANDIDATE_SHA..."
          for i in {1..30}; do
            STATUS_JSON=$(gh run list --repo "$REPO" --commit "$CANDIDATE_SHA" --workflow ci.yml --json status,conclusion --jq '.[0] // empty')
            if [ -n "$STATUS_JSON" ]; then
              STATUS=$(echo "$STATUS_JSON" | jq -r '.status // empty')
              CONCLUSION=$(echo "$STATUS_JSON" | jq -r '.conclusion // empty')
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "CI completed successfully on $CANDIDATE_SHA"
                  echo "should_run=true" >> "$GITHUB_OUTPUT"
                  exit 0
                else
                  echo "::error::CI completed with conclusion '$CONCLUSION' on $CANDIDATE_SHA (expected 'success')"
                  exit 1
                fi
              fi
              echo "CI run in progress (status: $STATUS). Waiting 10s ($i/30)..."
            else
              echo "CI run not found yet for $CANDIDATE_SHA. Waiting 10s ($i/30)..."
            fi
            sleep 10
          done

          echo "::error::Timed out waiting for CI on $CANDIDATE_SHA"
          exit 1

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        if: steps.preflight.outputs.should_run == 'true'
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agent-interaction-kit
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        if: steps.preflight.outputs.should_run == 'true'
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publish:
    needs: release
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.release.outputs.created == 'true') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag }}
    steps:
      - name: Validate tag input and checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch origin/main and all tags
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::RELEASE_TAG is required but empty"
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main --tags --force

      - name: Verify release exists and checkout tag commit
        id: verify_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying release exists for tag: $RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json tagName,targetCommitish

          TAG_SHA=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          echo "Checking out exact tag commit: $TAG_SHA"
          git checkout "$TAG_SHA"

          echo "Running verify-release.mjs..."
          node scripts/release/verify-release.mjs "$RELEASE_TAG"

      - name: Verify CI push completion on tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ steps.verify_release.outputs.sha }}
        run: |
          REPO="${{ github.repository }}"
          echo "Verifying CI push completion on exact tag commit: $TAG_SHA"
          for i in {1..30}; do
            STATUS_JSON=$(gh run list --repo "$REPO" --commit "$TAG_SHA" --workflow ci.yml --event push --json status,conclusion --jq '.[0] // empty')
            if [ -n "$STATUS_JSON" ]; then
              STATUS=$(echo "$STATUS_JSON" | jq -r '.status // empty')
              CONCLUSION=$(echo "$STATUS_JSON" | jq -r '.conclusion // empty')
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "CI push run completed successfully on $TAG_SHA"
                  exit 0
                else
                  echo "::error::CI completed with conclusion '$CONCLUSION' on $TAG_SHA (expected 'success')"
                  exit 1
                fi
              fi
              echo "CI run in progress (status: $STATUS). Waiting 10s ($i/30)..."
            else
              echo "CI run not found yet for $TAG_SHA. Waiting 10s ($i/30)..."
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for CI completion on $TAG_SHA"
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates and build
        run: |
          pnpm check
          pnpm knip
          pnpm --filter @agent-interaction-kit/core typecheck
          pnpm test
          pnpm build:core

      - name: Inspect, pack, and smoke tarball
        id: pack
        run: |
          mkdir -p dist-package
          node scripts/release/pack-inspect.mjs packages/core
          PACK_OUTPUT=$(npm pack --json --pack-destination dist-package ./packages/core)
          TARBALL_NAME=$(node -e "console.log(JSON.parse(process.argv[2] || process.argv[1])[0].filename)" "$PACK_OUTPUT")
          TARBALL_PATH="dist-package/$TARBALL_NAME"
          VERSION="${{ steps.verify_release.outputs.version }}"

          INTEGRITY=$(node scripts/release/publish-decision.mjs sri-hash "$TARBALL_PATH")

          echo "tarball_name=$TARBALL_NAME" >> "$GITHUB_OUTPUT"
          echo "tarball_path=$TARBALL_PATH" >> "$GITHUB_OUTPUT"
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"

          echo "Running smoke test on $TARBALL_PATH for version $VERSION..."
          node scripts/release/smoke-package.mjs "$TARBALL_PATH" "$VERSION"

      - name: Attach tarball to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL_PATH: ${{ steps.pack.outputs.tarball_path }}
          TARBALL_NAME: ${{ steps.pack.outputs.tarball_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx "$TARBALL_NAME"; then
            echo "Tarball $TARBALL_NAME already present in release $RELEASE_TAG assets. Skipping upload."
          else
            gh release upload "$RELEASE_TAG" "$TARBALL_PATH" --clobber=false
          fi

      - name: Bootstrap gate (record pending artifact)
        if: vars.NPM_PUBLISH_ENABLED != 'true'
        env:
          VERSION: ${{ steps.verify_release.outputs.version }}
          NPM_CHANNEL: ${{ steps.verify_release.outputs.channel }}
          TAG_SHA: ${{ steps.verify_release.outputs.sha }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
          TARBALL_NAME: ${{ steps.pack.outputs.tarball_name }}
        run: |
          echo "NPM_PUBLISH_ENABLED is not 'true'."
          echo "Package is in bootstrap mode awaiting manual initial maintainer publish."
          node -e '
            import fs from "node:fs";
            const pending = {
              status: "pending-bootstrap",
              version: process.env.VERSION,
              channel: process.env.NPM_CHANNEL,
              tag: process.env.RELEASE_TAG,
              sha: process.env.TAG_SHA,
              integrity: process.env.INTEGRITY,
              tarball: process.env.TARBALL_NAME,
              createdAt: new Date().toISOString(),
            };
            fs.writeFileSync("publication-pending.json", JSON.stringify(pending, null, 2) + "\n");
          '
          cat publication-pending.json

      - name: Upload publication-pending artifact
        if: vars.NPM_PUBLISH_ENABLED != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-pending
          path: publication-pending.json
          retention-days: 30

      - name: Check registry and publish with OIDC or verify integrity
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        id: registry_step
        env:
          VERSION: ${{ steps.verify_release.outputs.version }}
          NPM_CHANNEL: ${{ steps.verify_release.outputs.channel }}
          TARBALL_PATH: ${{ steps.pack.outputs.tarball_path }}
          LOCAL_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          PACKAGE="@agent-interaction-kit/core"
          SPEC="$PACKAGE@$VERSION"
          echo "Checking registry for $SPEC..."

          set +e
          VIEW_OUTPUT=$(npm view "$SPEC" --json 2>&1)
          VIEW_STATUS=$?
          set -e

          if [ $VIEW_STATUS -eq 0 ]; then
            echo "Version $VERSION found in registry."
            REG_INTEGRITY=$(node -e "const d = JSON.parse(process.argv[2] || process.argv[1]); console.log(d.dist?.integrity || '');" "$VIEW_OUTPUT")

            if [ -z "$REG_INTEGRITY" ]; then
              echo "::error::Registry metadata for $SPEC does not contain dist.integrity"
              exit 1
            fi

            if [ "$REG_INTEGRITY" != "$LOCAL_INTEGRITY" ]; then
              echo "::error::Integrity mismatch for $SPEC!"
              echo "  Registry integrity: $REG_INTEGRITY"
              echo "  Local tarball:      $LOCAL_INTEGRITY"
              echo "Possible tampering or divergent build."
              exit 1
            fi

            echo "Integrity verified ($LOCAL_INTEGRITY). Package already published."

            CURRENT_HEAD=$(npm view @agent-interaction-kit/core "dist-tags.$NPM_CHANNEL" 2>/dev/null || echo "")
            if [ -n "$CURRENT_HEAD" ]; then
              CMP=$(node scripts/release/publish-decision.mjs compare-semver "$VERSION" "$CURRENT_HEAD")
              if [ "$CMP" -lt 0 ]; then
                echo "Notice: $VERSION is older than current $NPM_CHANNEL head ($CURRENT_HEAD). Retaining current dist-tag."
              fi
            fi
          else
            if echo "$VIEW_OUTPUT" | grep -qE "(E404|404 Not Found)"; then
              echo "Version $VERSION not found in registry (404). Publishing with tag '$NPM_CHANNEL' via OIDC..."
              npm publish "$TARBALL_PATH" --access public --tag "$NPM_CHANNEL"
            else
              echo "::error::Registry check failed with unexpected error (exit code $VIEW_STATUS):"
              echo "$VIEW_OUTPUT"
              echo "Do not treat network/auth/registry errors as 404."
              exit 1
            fi
          fi

      - name: Wait for registry availability and verify via smoke test
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        env:
          VERSION: ${{ steps.verify_release.outputs.version }}
        run: |
          SPEC="@agent-interaction-kit/core@$VERSION"
          echo "Waiting for $SPEC to become available in registry..."
          FOUND=false
          for i in {1..12}; do
            if npm view "$SPEC" version >/dev/null 2>&1; then
              echo "$SPEC is available in registry!"
              FOUND=true
              break
            fi
            echo "Waiting for $SPEC in registry... ($i/12, sleeping 10s)"
            sleep 10
          done

          if [ "$FOUND" != "true" ]; then
            echo "::error::Timed out waiting for $SPEC to appear in npm registry."
            exit 1
          fi

          echo "Running smoke test on published spec $SPEC..."
          node scripts/release/smoke-package.mjs "$SPEC" "$VERSION"

      - name: Generate publication metadata
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        env:
          VERSION: ${{ steps.verify_release.outputs.version }}
          NPM_CHANNEL: ${{ steps.verify_release.outputs.channel }}
          TAG_SHA: ${{ steps.verify_release.outputs.sha }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e '
            import fs from "node:fs";
            const pub = {
              version: process.env.VERSION,
              channel: process.env.NPM_CHANNEL,
              tag: process.env.RELEASE_TAG,
              sha: process.env.TAG_SHA,
              integrity: process.env.INTEGRITY,
              verifiedAt: new Date().toISOString(),
              workflowRunUrl: process.env.WORKFLOW_RUN_URL,
            };
            fs.writeFileSync("publication.json", JSON.stringify(pub, null, 2) + "\n");
          '
          cat publication.json

      - name: Upload publication.json to GitHub Release
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" publication.json --clobber

      - name: Upload publication.json artifact
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication
          path: publication.json
          retention-days: 30
