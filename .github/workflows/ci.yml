name: CI

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-interaction-kit/core typecheck
      - run: pnpm test
      - run: pnpm build:core
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm --filter @agent-interaction-kit/website exec playwright install --with-deps chromium
      - run: pnpm test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-browser-report
          path: |
            apps/website/playwright-report/
            apps/website/test-results/
          retention-days: 7
