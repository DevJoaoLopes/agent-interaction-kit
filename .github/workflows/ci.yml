name: CI Matrix

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm knip

  core-matrix:
    name: Core (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-interaction-kit/core typecheck
      - run: pnpm test
      - run: pnpm build:core

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:core
      - run: pnpm build:web
      - run: pnpm --filter @agent-interaction-kit/website typecheck
      - run: pnpm --filter @agent-interaction-kit/website exec playwright install --with-deps chromium
      - run: pnpm test:web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: website-browser-report
          path: |
            apps/website/playwright-report/
            apps/website/test-results/
          retention-days: 7

  package-smoke:
    name: Package Smoke (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm build:core
      - name: Pack and smoke core package
        run: |
          node scripts/release/pack-inspect.mjs packages/core
          TMP_DIR=$(mktemp -d)
          PACK_OUTPUT=$(npm pack --json --pack-destination "$TMP_DIR" ./packages/core)
          TARBALL_NAME=$(node -e "console.log(JSON.parse(process.argv[1])[0].filename)" "$PACK_OUTPUT")
          TARBALL_PATH="$TMP_DIR/$TARBALL_NAME"
          VERSION=$(node -p "JSON.parse(fs.readFileSync('./packages/core/package.json', 'utf8')).version")
          node scripts/release/smoke-package.mjs "$TARBALL_PATH" "$VERSION"
          rm -rf "$TMP_DIR"

  required:
    name: CI required
    if: ${{ always() }}
    needs: [lint, core-matrix, website, package-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test group
        env:
          LINT: ${{ needs.lint.result }}
          CORE: ${{ needs.core-matrix.result }}
          WEBSITE: ${{ needs.website.result }}
          SMOKE: ${{ needs.package-smoke.result }}
        run: |
          test "$LINT" = success
          test "$CORE" = success
          test "$WEBSITE" = success
          test "$SMOKE" = success
